name: Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide semver bump from PR branch name
        id: bump
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          branch_lower=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]')
          case "$branch_lower" in
            major/*)
              echo "level=major" >> "$GITHUB_OUTPUT"
              ;;
            feat/*)
              echo "level=minor" >> "$GITHUB_OUTPUT"
              ;;
            fix/*)
              echo "level=patch" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Branch must be fix/*, feat/*, or major/* — skipping release."
              echo "level=skip" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Compute next version
        if: steps.bump.outputs.level != 'skip'
        id: version
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest=${latest#v}
          if [ -z "$latest" ]; then latest="0.0.0"; fi
          IFS=. read -r major minor patch <<< "$latest"
          case "${{ steps.bump.outputs.level }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          new="${major}.${minor}.${patch}"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new" >> "$GITHUB_OUTPUT"

      - name: Bump pyproject.toml and tag
        if: steps.bump.outputs.level != 'skip'
        run: |
          sed -i.bak -E "s/^version = \".*\"/version = \"${{ steps.version.outputs.new }}\"/" pyproject.toml
          rm -f pyproject.toml.bak
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:${{ github.event.pull_request.base.ref }}
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.bump.outputs.level != 'skip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      - uses: actions/setup-python@v5
        if: steps.bump.outputs.level != 'skip'
        with:
          python-version: "3.12"

      - name: Build and publish to PyPI
        if: steps.bump.outputs.level != 'skip'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine upload dist/*
